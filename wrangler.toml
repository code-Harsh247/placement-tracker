name = "placement-tracker"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Cloudflare Access settings, used by functions/api/_middleware.js to verify
# that every API request comes from a signed-in user.
#   ACCESS_TEAM_DOMAIN: https://<your-team>.cloudflareaccess.com
#   ACCESS_AUD: the "Application Audience (AUD) Tag" of the Access application
# While these are empty the API refuses every request (fails closed).
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[d1_databases]]
binding = "DB"
database_name = "placement-tracker"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
